name: MLOps Misinformation Detection Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check data files
        run: |
          echo "Checking data files..."
          ls -la data/raw/
          echo "✅ Data files found"

      - name: Run baseline models
        run: python src/baseline.py

      - name: Run evaluation
        run: python src/evaluate.py

      - name: Show results
        run: |
          cat results/baseline_results.json
          cat results/full_evaluation.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: results/
          retention-days: 30

  docker-build:
    runs-on: ubuntu-latest
    needs: train-and-evaluate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t mlops-misinformation-detection .
          echo "✅ Docker image built successfully"

      - name: Test Docker container
        run: |
          docker run --rm \
            -v $(pwd)/data:/app/data \
            -v $(pwd)/results:/app/results \
            mlops-misinformation-detection \
            python src/baseline.py
          echo "✅ Docker container runs successfully"
