name: MLOps Misinformation Detection Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn pandas numpy mlflow

      - name: Check data files exist
        run: |
          echo "Checking data files..."
          ls -la data/raw/
          echo "✅ Data files found"

      - name: Run baseline models
        run: |
          echo "Running baseline models..."
          python src/baseline.py

      - name: Run evaluation
        run: |
          echo "Running evaluation..."
          python src/evaluate.py

      - name: Show results
        run: |
          echo "Results:"
          cat results/baseline_results.json
          cat results/full_evaluation.json

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: results/
          retention-days: 30
